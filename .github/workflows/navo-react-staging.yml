name: NAVO React staging build
on:
  push:
    branches: [refactor-stable]
    paths:
      - 'react-app/**'
      - '.github/workflows/navo-react-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Upload compiled frontend
        uses: actions/upload-artifact@v4
        with:
          name: navo-react-dist
          path: react-app/dist

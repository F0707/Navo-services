<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NAVO Services — Записи</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#18232b;background:#edf2f7}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}.app{max-width:520px;margin:auto;min-height:100dvh;background:linear-gradient(160deg,#fafcff,#e9eff5);padding:20px 16px 116px}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 32px}.brandmark{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:800}.brandmark i{font-style:normal;background:linear-gradient(135deg,#008b50,#064d3a);color:white;border-radius:8px;padding:6px 9px;font-size:21px}.brandmark em{font-style:normal;font-weight:450;font-size:14px}.brand-actions{display:flex;gap:12px}.iconbtn{border:0;background:transparent;font-size:24px;color:#263a42;padding:5px}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h1{font-size:36px;margin:0;letter-spacing:-1px}.segments{display:grid;grid-template-columns:1fr 1.35fr .8fr;background:#e4e8ed;padding:4px;border-radius:17px;gap:3px}.segment{border:0;border-radius:13px;background:transparent;color:#616b75;padding:12px 4px;font-size:13px;white-space:nowrap}.segment.active{background:linear-gradient(120deg,#00994f,#006a40);color:white;font-weight:800;box-shadow:0 3px 7px #06743a30}.date{font-size:18px;font-weight:700;color:#3d4950;margin:26px 0 15px}.cards{display:grid;gap:15px}.appointment{background:#fff;border-radius:20px;padding:17px 14px 0;box-shadow:0 8px 22px #172d3e13}.details{display:grid;grid-template-columns:91px minmax(0,1fr);gap:13px;align-items:start}.time{border-right:1px solid #e0e5e9;padding:5px 10px 12px 0}.time strong{font-size:25px;white-space:nowrap}.time small{display:block;color:#87909a;margin-top:8px;font-size:14px}.clientline{display:flex;justify-content:space-between;gap:5px;align-items:start;flex-wrap:wrap}.clientline strong{font-size:14px;overflow-wrap:anywhere}.pill{font-size:11px;font-weight:700;background:#d5f7dd;color:#096c37;padding:6px 7px;border-radius:20px;white-space:nowrap}.service{font-size:13px;color:#6c7680;margin:11px 0 8px}.price{font-size:20px;color:#076e3b;font-weight:800}.actions{border-top:1px solid #e7eaee;margin-top:16px;display:grid;grid-template-columns:1fr 1fr 1.5fr}.action{border:0;background:transparent;color:#65717a;padding:14px 2px;font-size:13px}.action:not(:last-child){border-right:1px solid #e7eaee}.action b{color:#008249;font-size:18px;vertical-align:middle}.action:last-child{text-align:right}.fab{position:fixed;right:max(18px,calc((100vw - 520px)/2 + 18px));bottom:105px;border:0;border-radius:40px;background:linear-gradient(135deg,#008c53,#006340);color:#fff;padding:16px 23px;font-size:18px;font-weight:800;box-shadow:0 8px 20px #006a4460}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -6px 22px #22334414;display:grid;grid-template-columns:repeat(4,1fr);padding:11px 4px max(12px,env(safe-area-inset-bottom))}.tab{border:0;background:none;color:#6d747d;font-size:12px;display:grid;gap:3px;justify-items:center;padding:5px 1px}.tab span{font-size:24px}.tab.active{color:#007743;font-weight:800}.tab.active span{background:#e0f8e8;border-radius:12px;padding:0 12px}.empty{background:#fff;border-radius:18px;padding:24px;text-align:center;color:#637079}.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#164735;color:white;border-radius:14px;padding:12px 18px;z-index:10;display:none;text-align:center;max-width:90vw}.demo{font-size:11px;color:#94a0a9;text-align:center;margin-top:25px}@media(min-width:600px){body{padding:25px}.app{border-radius:28px;box-shadow:0 12px 36px #0002}.tabs{bottom:0}}
</style></head><body><div id="toast" class="toast"></div><main class="app"><div class="brand"><div class="brandmark"><i>N</i><span>NAVO <em>Services</em></span></div><div class="brand-actions"><button class="iconbtn" onclick="msg('Уведомления: демонстрация')">♧</button><button class="iconbtn" onclick="msg('Настройки: демонстрация')">⚙</button></div></div><div class="heading"><h1>Записи</h1><button class="iconbtn" onclick="document.getElementById('datefilter').showPicker?.();document.getElementById('datefilter').focus()">▽</button><input id="datefilter" type="date" style="position:absolute;opacity:0;width:1px;height:1px" onchange="msg('Дата: '+this.value)"></div><div class="segments"><button class="segment active" onclick="segment(this,'today')">Сегодня (1)</button><button class="segment" onclick="segment(this,'upcoming')">Предстоящие (3)</button><button class="segment" onclick="segment(this,'history')">История</button></div><div class="date" id="date">▣ Пятница, 13 ноября</div><div class="cards" id="cards"></div><div class="demo">Демонстрационный дизайн · данные примерные</div></main><button class="fab" onclick="msg('Форма новой записи будет подключена к NAVO')">＋ Запись</button><nav class="tabs"><button class="tab" onclick="nav(this,'Главная')"><span>⌂</span>Главная</button><button class="tab active" onclick="nav(this,'Записи')"><span>▣</span>Записи</button><button class="tab" onclick="nav(this,'Чаты')"><span>☏</span>Чаты</button><button class="tab" onclick="nav(this,'Профиль')"><span>♙</span>Профиль</button></nav><script>
const examples={today:[['13:30','45 мин','+992 91 960-32-02','Стрижка и оформление','35 TJS'],['15:00','45 мин','+992 91 960-32-02','Стрижка и оформление','35 TJS']],upcoming:[['10:00','30 мин','Алишер','Мужская стрижка','40 TJS'],['12:00','45 мин','Парвиз','Стрижка и борода','55 TJS'],['16:30','30 мин','Клиент','Стрижка','35 TJS']],history:[['11:00','45 мин','Клиент','Стрижка и оформление','35 TJS']]};let timeout;function msg(s){const e=document.getElementById('toast');e.textContent=s;e.style.display='block';clearTimeout(timeout);timeout=setTimeout(()=>e.style.display='none',2500)}function render(type){document.getElementById('date').textContent=type==='today'?'▣ Пятница, 13 ноября':type==='upcoming'?'▣ Предстоящие записи':'▣ История записей';document.getElementById('cards').innerHTML=examples[type].map((b,i)=>'<article class="appointment"><div class="details"><div class="time"><strong>'+b[0]+'</strong><small>'+b[1]+'</small></div><div><div class="clientline"><strong>'+b[2]+'</strong><span class="pill">✓ '+(type==='history'?'Завершена':'Подтверждена')+'</span></div><div class="service">'+b[3]+'</div><div class="price">'+b[4]+'</div></div></div><div class="actions"><button class="action" onclick="msg(\'Звонок — демонстрация\')"><b>☎</b> Звонок</button><button class="action" onclick="msg(\'Чат — демонстрация\')"><b>◯</b> Чат</button><button class="action" onclick="msg(\'Детали записи — демонстрация\')">Подробнее <b>›</b></button></div></article>').join('')}function segment(el,type){document.querySelectorAll('.segment').forEach(x=>x.classList.remove('active'));el.classList.add('active');render(type)}function nav(el,name){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');if(name!=='Записи')msg(name+' — будет подключено в основном NAVO')}render('today');</script></body></html>

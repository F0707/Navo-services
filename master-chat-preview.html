<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NAVO — Чат по записи</title><style>
*{box-sizing:border-box}body{margin:0;background:#eaf0ee;font:15px system-ui,-apple-system,Arial,sans-serif;color:#17251f}.phone{max-width:520px;margin:auto;height:100dvh;display:flex;flex-direction:column;background:#f6f8fa;box-shadow:0 0 30px #1233}.header{background:linear-gradient(130deg,#007e54,#005b40);color:#fff;padding:22px 16px 23px;display:flex;align-items:center;justify-content:space-between;gap:10px}.header strong{font-size:20px}.headbtn{border:0;background:none;color:white;font-size:26px;min-width:35px}.context{background:white;border-radius:0 0 25px 25px;padding:16px;box-shadow:0 8px 20px #14332410}.person{display:flex;align-items:center;gap:12px}.avatar{height:55px;width:55px;flex:none;border-radius:50%;background:#c8e5d5;color:#006d45;border:2px solid #008756;display:grid;place-items:center;font-size:25px;font-weight:800}.person strong{font-size:15px;overflow-wrap:anywhere}.appt{margin:12px 0 0 67px;display:inline-block;border-radius:30px;background:#e1f8eb;color:#1a6247;padding:9px 11px;font-size:12px}.messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding:24px 15px}.bubble{max-width:85%;padding:13px 15px;border-radius:19px;font-size:16px;line-height:1.4;box-shadow:0 3px 10px #203a2910}.bubble.in{background:#e8e9ed;align-self:flex-start;border-bottom-left-radius:5px}.bubble.out{background:#006d4b;color:#fff;align-self:flex-end;border-bottom-right-radius:5px}.meta{font-size:11px;opacity:.7;text-align:right;margin-top:5px}.bottom{padding:9px 13px max(14px,env(safe-area-inset-bottom));background:#f6f8fa}.quick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:13px}.quick button{border:1px solid #add5c1;background:#eaf8ef;border-radius:24px;padding:9px 12px;font-size:13px;color:#175d40}.compose{display:flex;gap:8px;align-items:center}.inputwrap{background:white;border:1px solid #d9e2df;border-radius:35px;display:flex;align-items:center;flex:1;min-width:0;padding:5px 7px 5px 15px}.inputwrap input{min-width:0;flex:1;border:0;outline:0;font:inherit;background:transparent;padding:10px 0}.attach{border:0;background:none;color:#677b75;font-size:21px;padding:5px}.send{width:52px;height:52px;flex:none;border:0;border-radius:50%;background:#00965b;color:white;font-size:24px;box-shadow:0 5px 14px #00754c35}.notice{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#153e2e;color:#fff;border-radius:13px;padding:12px;display:none;z-index:5;max-width:90%;text-align:center}
</style></head><body><div class="notice" id="notice"></div><main class="phone"><header class="header"><button class="headbtn" onclick="history.length>1?history.back():note('Назад к списку чатов')">‹</button><strong>Чат по записи</strong><button class="headbtn" onclick="location.href='tel:+992981061171'">☎</button></header><section class="context"><div class="person"><div class="avatar">К</div><strong>Клиент (+992 98 106-11-71)</strong></div><div class="appt">▣ 05.11 в 11:30 · Мужская стрижка</div></section><section class="messages" id="messages"><div class="bubble in">Здравствуйте! Я на месте, у входа.<div class="meta">11:28</div></div><div class="bubble out">Здравствуйте! Проходите, я готов.<div class="meta">11:29 ✓✓</div></div></section><section class="bottom"><div class="quick"><button onclick="quick('Я в дороге')">Я в дороге</button><button onclick="quick('Буду через 5 мин')">Буду через 5 мин</button><button onclick="quick('Опаздываю на 10 мин')">Опаздываю на 10 мин</button><button onclick="quick('Жду вас')">Жду вас</button></div><form class="compose" onsubmit="send(event)"><div class="inputwrap"><input id="message" placeholder="Сообщение..." autocomplete="off"><button type="button" class="attach" onclick="note('Вложения подключим позже')">♧</button><button type="button" class="attach" onclick="document.getElementById('message').value+=' 😊'">☺</button></div><button class="send" type="submit" aria-label="Отправить">➤</button></form></section></main><script>
function quick(s){document.getElementById('message').value=s;document.getElementById('message').focus()}function send(e){e.preventDefault();const inp=document.getElementById('message'),s=inp.value.trim();if(!s)return;const b=document.createElement('div');b.className='bubble out';b.textContent=s;const t=document.createElement('div');t.className='meta';t.textContent=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+' ✓';b.appendChild(t);const m=document.getElementById('messages');m.appendChild(b);m.scrollTop=m.scrollHeight;inp.value=''}let timer;function note(s){const n=document.getElementById('notice');n.textContent=s;n.style.display='block';clearTimeout(timer);timer=setTimeout(()=>n.style.display='none',2300)}
</script></body></html>

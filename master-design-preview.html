<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NAVO — Кабинет мастера (макет)</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#182822;background:#eef2f5}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}.app{max-width:520px;margin:auto;min-height:100dvh;padding:26px 17px 112px}.top{display:flex;justify-content:space-between;align-items:center;margin:0 0 26px}h1{font-size:27px;letter-spacing:-.7px;margin:0}h2{font-size:24px;letter-spacing:-.5px;margin:32px 0 17px}.gear{background:none;border:0;font-size:26px}.profile{display:flex;align-items:center;gap:17px}.avatar{width:92px;height:92px;border:3px solid #006c48;border-radius:50%;background:linear-gradient(140deg,#dbe8e3,#b8d5ca);display:grid;place-items:center;font-size:38px;font-weight:800;color:#075b41}.person strong{display:block;font-size:25px}.address{font-size:13px;color:#5c6868;margin:7px 0}.rating{font-size:19px;color:#007347;font-weight:800}.actions{display:flex;gap:9px;margin:23px 0 28px}.status{background:#ffe9bd;color:#8a5812;padding:12px 14px;border-radius:30px;font-weight:700;font-size:13px;white-space:nowrap}.ghost{flex:1;border:1px solid #ccd5d8;background:#f7f9fa;color:#657278;border-radius:30px;padding:12px 8px;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.stat{border:0;border-radius:18px;background:#fff;box-shadow:0 8px 18px #102e2312;padding:16px 8px;text-align:center;min-height:116px}.stat .ico{font-size:23px;color:#00744c}.stat .label{font-size:13px;display:block;margin:8px 0}.stat strong{font-size:27px}.stat.balance strong{font-size:20px;color:#006b46;white-space:nowrap}.section-title{display:flex;justify-content:space-between;align-items:center}.section-title button{border:0;background:transparent;color:#006f49;font-size:15px}.bookings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.booking{background:#fff;border-radius:19px;box-shadow:0 7px 17px #142f2115;padding:18px 13px 17px;border-left:5px solid #087e55;min-height:210px}.booking .time{font-weight:800;font-size:19px}.booking .client{font-size:19px;font-weight:800;margin-top:18px}.booking .service{font-size:13px;color:#596761;min-height:36px;margin:10px 0}.confirmed{background:#d9f5e2;color:#14603a;font-size:12px;border-radius:22px;padding:8px 9px;display:inline-block;white-space:nowrap}.new{width:100%;margin-top:34px;background:#006d49;color:#fff;border:0;border-radius:17px;font-size:22px;font-weight:800;padding:22px 12px;box-shadow:0 9px 18px #006b4924}.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);background:#fff;box-shadow:0 -5px 18px #142f2112;border-radius:22px 22px 0 0;display:grid;grid-template-columns:repeat(4,1fr);padding:12px 4px max(12px,env(safe-area-inset-bottom))}.tab{border:0;background:transparent;color:#65706e;display:grid;justify-items:center;gap:5px;font-size:12px}.tab span{font-size:23px}.tab.active{color:#006b49;font-weight:800}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#173e31;color:#fff;border-radius:14px;padding:12px 18px;box-shadow:0 8px 22px #0003;max-width:90%;z-index:10;display:none;text-align:center}.note{text-align:center;color:#81918b;font-size:11px;margin-top:16px}@media(min-width:600px){body{padding:30px}.app{border-radius:32px;background:#eef2f5;box-shadow:0 14px 50px #1e3b2a22;min-height:800px}.tabbar{bottom:20px;border-radius:20px}}
</style></head><body><div class="toast" id="toast"></div><main class="app"><div class="top"><h1>Кабинет мастера</h1><button class="gear" onclick="msg('Настройки будут подключены в основной версии')">⚙</button></div><div class="profile"><div class="avatar">О</div><div class="person"><strong>Обидов</strong><div class="address">📍 Душанбе, пр. Рудаки 100</div><div class="rating">★ 5.0</div></div></div><div class="actions"><span class="status">◷ На проверке</span><button class="ghost" onclick="msg('Просмотр глазами клиента — в основной версии')">◉ Как видит клиент</button></div><div class="stats"><button class="stat" onclick="msg('Записи за сегодня: 3 (пример)')"><div class="ico">▣</div><span class="label">Сегодня</span><strong>3</strong></button><button class="stat" onclick="msg('Чаты: 2 (пример)')"><div class="ico">☏</div><span class="label">Чаты</span><strong>2</strong></button><button class="stat balance" onclick="msg('Баланс: 450 TJS (пример)')"><div class="ico">▤</div><span class="label">Баланс</span><strong>450 TJS</strong></button></div><div class="section-title"><h2>Ближайшие записи</h2><button onclick="msg('Все записи — в основной версии')">Все ›</button></div><div class="bookings"><div class="booking"><div class="time">10:00–11:30</div><div class="client">Алишер</div><div class="service">Стрижка и борода</div><span class="confirmed">✓ Подтверждено</span></div><div class="booking"><div class="time">12:00</div><div class="client">Парвиз</div><div class="service">Стрижка</div><span class="confirmed">✓ Подтверждено</span></div></div><button class="new" onclick="msg('Новая запись будет подключена к NAVO')">＋ Новая запись</button><div class="note">Демонстрация дизайна · данные вымышленные</div></main><nav class="tabbar"><button class="tab active" onclick="selectTab(this,'Главная')"><span>⌂</span>Главная</button><button class="tab" onclick="selectTab(this,'Календарь')"><span>▦</span>Календарь</button><button class="tab" onclick="selectTab(this,'Чаты')"><span>▤</span>Чаты</button><button class="tab" onclick="selectTab(this,'Профиль')"><span>♙</span>Профиль</button></nav><script>let t;function msg(s){const e=document.getElementById('toast');e.textContent=s;e.style.display='block';clearTimeout(t);t=setTimeout(()=>e.style.display='none',2700)}function selectTab(el,name){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');if(name!=='Главная')msg(name+' — демонстрационный экран')}</script></body></html>

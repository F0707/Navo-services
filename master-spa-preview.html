<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NAVO — единый кабинет мастера</title><style>
:root{font:15px system-ui,-apple-system,Arial,sans-serif;color:#172b24;background:#e8f0ee}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:520px;margin:auto;height:100dvh;background:#f4f7f8;position:relative;overflow:hidden}.page{height:100%;overflow:auto;padding:20px 15px 110px;scrollbar-width:thin}.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.logo{font-weight:900;font-size:21px}.logo b{background:#08734d;color:white;border-radius:8px;padding:5px 10px;margin-right:6px}.muted{color:#74827d}.h1{font-size:29px;font-weight:850;margin:0 0 22px}.profile-head{display:flex;align-items:center;gap:14px}.avatar{width:76px;height:76px;flex:none;border-radius:50%;display:grid;place-items:center;background:#d5ebe0;border:3px solid #087b52;color:#087b52;font-size:35px;font-weight:850}.name{font-size:25px;font-weight:850}.addr{font-size:12px;color:#61766b;margin:6px 0}.rating{font-size:18px;color:#08734d;font-weight:800}.profile-actions{display:flex;gap:8px;margin:18px 0 22px}.pending{border-radius:30px;background:#ffebc8;color:#885b15;padding:11px 13px;font-size:13px}.outline{border:1px solid #d1ddd7;border-radius:30px;background:white;color:#5c7066;padding:10px 12px;flex:1}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.metric{border:0;background:white;border-radius:17px;padding:14px 6px;min-height:105px;box-shadow:0 5px 17px #133d2d13;text-align:center}.metric .symbol{font-size:22px;color:#008354}.metric label{display:block;font-size:13px;margin:6px 0}.metric strong{font-size:24px}.metric.balance strong{font-size:18px;color:#00744a}.row-title{display:flex;align-items:center;justify-content:space-between;margin:27px 0 14px}.row-title h2{font-size:22px;margin:0}.link{border:0;background:none;color:#00754a;font-weight:700}.mini-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.mini{border:0;text-align:left;background:#fff;border-left:4px solid #008055;border-radius:16px;padding:14px 10px;min-height:180px;box-shadow:0 7px 17px #1a342219}.mini .time{font-size:20px;font-weight:850}.mini .client{font-size:18px;font-weight:800;margin:16px 0 6px}.mini .service{font-size:12px;color:#67756e;min-height:35px}.badge{display:inline-block;border-radius:20px;padding:6px 8px;background:#daf6e4;color:#146b41;font-size:11px;font-weight:750}.badge.cancelled{background:#f8e0e0;color:#9a4444}.badge.completed{background:#e5e8f3;color:#52618b}.primary{width:100%;background:#006e4b;color:white;border:0;border-radius:15px;padding:16px;font-weight:800;font-size:18px;margin-top:24px}.segments{display:grid;grid-template-columns:1fr 1.35fr .85fr;background:#e5e9eb;border-radius:16px;padding:4px;gap:2px}.segment{border:0;border-radius:13px;background:transparent;color:#66746c;padding:12px 2px;font-size:12px}.segment.active{background:#008050;color:white;font-weight:800}.day{font-size:17px;font-weight:800;color:#4b5c54;margin:24px 0 12px}.booking{background:white;border-radius:17px;padding:15px 13px 0;margin-bottom:12px;box-shadow:0 5px 17px #153f2b13;scroll-margin-top:15px}.booking-main{display:grid;grid-template-columns:83px minmax(0,1fr);gap:12px}.book-time{font-size:22px;font-weight:850;border-right:1px solid #e0e7e3}.book-time small{display:block;font-size:12px;color:#86928a;font-weight:400;margin-top:8px}.book-name{font-weight:800;font-size:14px;overflow-wrap:anywhere}.book-service{font-size:13px;color:#687970;margin:9px 0}.price{font-size:19px;font-weight:850;color:#00754b}.book-actions{border-top:1px solid #e6ede9;display:grid;grid-template-columns:repeat(3,1fr);margin-top:13px}.book-actions button{border:0;background:transparent;padding:14px 1px;color:#08754d;font-size:13px}.book-actions button+button{border-left:1px solid #e6ede9}.book-extra{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #edf1ef;padding:10px 0}.book-extra select{border:1px solid #d3dfd7;border-radius:9px;padding:8px;font-size:12px;max-width:150px;background:white}.tabs{position:absolute;bottom:0;width:100%;display:grid;grid-template-columns:repeat(4,1fr);background:white;box-shadow:0 -5px 19px #133c2b13;border-radius:22px 22px 0 0;padding:12px 3px max(12px,env(safe-area-inset-bottom));z-index:4}.tab{border:0;background:none;color:#758179;font-size:12px}.tab span{display:block;font-size:23px;margin-bottom:3px}.tab.active{color:#00784c;font-weight:850}.chat-screen{position:absolute;inset:0;background:#f7f9fa;display:none;flex-direction:column;z-index:8}.chat-screen.open{display:flex}.chat-top{background:linear-gradient(110deg,#008158,#005d43);color:white;display:flex;align-items:center;justify-content:space-between;padding:22px 13px}.chat-top strong{font-size:20px}.chat-top button{border:0;background:transparent;color:white;font-size:25px}.chat-info{background:white;border-radius:0 0 22px 22px;padding:15px;box-shadow:0 5px 14px #143e2710}.chat-person{font-size:17px;font-weight:800;overflow-wrap:anywhere}.chat-context{display:inline-block;background:#e0f7e9;color:#286747;border-radius:22px;padding:9px;margin-top:10px;font-size:12px}.messages{flex:1;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:22px 13px}.bubble{max-width:85%;padding:12px 14px;border-radius:17px;background:#e9ebee;align-self:flex-start;line-height:1.4;overflow-wrap:anywhere}.bubble.mine{background:#006e4b;color:white;align-self:flex-end}.msg-time{font-size:11px;text-align:right;opacity:.75;margin-top:5px}.chat-footer{padding:10px 12px max(13px,env(safe-area-inset-bottom))}.quick{display:flex;gap:8px;overflow:auto;padding-bottom:11px}.quick button{white-space:nowrap;border:1px solid #b8d9c8;border-radius:20px;background:#e9f8ef;color:#175c3d;padding:9px 12px}.composer{display:flex;gap:9px}.composer input{min-width:0;flex:1;border:1px solid #d7e1db;border-radius:28px;background:white;padding:13px 16px;outline:none}.composer button{border:0;background:#00935c;color:white;border-radius:50%;height:49px;width:49px;font-size:22px}.toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#214a3a;color:white;padding:11px 16px;border-radius:12px;z-index:15;display:none;max-width:90%;text-align:center}.empty{padding:24px;text-align:center;color:#77847e;background:white;border-radius:15px}.chat-list-item{display:block;width:100%;border:0;text-align:left;background:white;border-radius:15px;padding:15px;margin-bottom:10px;box-shadow:0 5px 13px #153e2910}.chat-list-item strong{display:block;margin-bottom:6px}.demo{text-align:center;color:#8b9890;font-size:11px;margin-top:22px}
</style></head><body><main class="app"><div class="toast" id="toast"></div><div class="page" id="page"></div><nav class="tabs" id="nav"></nav><section class="chat-screen" id="chatScreen"><div class="chat-top"><button onclick="backChat()" aria-label="Назад">←</button><strong>Чат по записи</strong><button id="callChat" aria-label="Позвонить">☎</button></div><div class="chat-info" id="chatInfo"></div><div class="messages" id="messages"></div><div class="chat-footer"><div class="quick" id="quick"></div><form class="composer" id="composer"><input id="messageInput" placeholder="Сообщение..." maxlength="500" autocomplete="off"><button type="submit" aria-label="Отправить">➤</button></form></div></section></main><script>
'use strict';
const KEY='navo-master-spa-preview-v1',tz='Asia/Dushanbe';const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const dayShift=n=>{const d=new Date(today()+'T12:00:00+05:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const seed=()=>({master:{id:'demo-master',name:'Обидов',phone:'+992 91 960-32-02',address:'Душанбе, пр. Рудаки 100',rating:5,status:'pending',balance:450},bookings:[{id:'b1',clientPhone:'+992 98 106-11-71',clientName:'Алишер',serviceName:'Стрижка и борода',date:today(),time:'13:30',durationMinutes:45,price:35,status:'confirmed'},{id:'b2',clientPhone:'+992 91 960-32-02',clientName:'Парвиз',serviceName:'Мужская стрижка',date:dayShift(1),time:'12:00',durationMinutes:45,price:40,status:'confirmed'},{id:'b3',clientPhone:'+992 93 555-11-22',clientName:'Фаррух',serviceName:'Стрижка и оформление',date:dayShift(2),time:'15:00',durationMinutes:30,price:35,status:'confirmed'}],chats:{b1:[{id:'m1',sender:'client',text:'Здравствуйте! Я на месте, у входа.',timestamp:new Date().toISOString(),isRead:true},{id:'m2',sender:'master',text:'Здравствуйте! Проходите, я готов.',timestamp:new Date().toISOString(),isRead:true}]},activeTab:'home',activeChatBookingId:null,filter:'today',baseBalance:450});
let state;try{state=JSON.parse(localStorage.getItem(KEY))||seed();if(!state.master||!Array.isArray(state.bookings)||!state.chats)state=seed()}catch(e){state=seed()}state.activeChatBookingId=null;let origin=null,scrollPositions={},toastTimer;
const $=id=>document.getElementById(id),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',3000)}
const isToday=b=>b.date===today(),future=b=>b.date>=today()&&b.status==='confirmed',sortBookings=a=>[...a].sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));const amount=()=>Number(state.baseBalance||0)+state.bookings.filter(b=>b.status==='completed').reduce((s,b)=>s+Number(b.price||0),0);const unread=()=>Object.values(state.chats).flat().filter(m=>m.sender==='client'&&!m.isRead).length;const convCount=()=>Object.values(state.chats).filter(v=>v.length).length;
function fmtDate(d){return new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}function navTo(tab,bookingId){if(state.activeChatBookingId)backChat();scrollPositions[state.activeTab]=$('page').scrollTop;state.activeTab=tab;if(tab==='bookings'&&bookingId){state.filter=isToday(state.bookings.find(b=>b.id===bookingId)||{})?'today':'upcoming'}save();render();if(bookingId){requestAnimationFrame(()=>{const el=document.getElementById('booking-'+bookingId);el?.scrollIntoView({block:'center',behavior:'smooth'})})}else $('page').scrollTop=scrollPositions[tab]||0}
function navHtml(){return [['home','⌂','Главная'],['bookings','▣','Записи'],['chats','☏','Чаты'],['profile','♙','Профиль']].map(([id,ic,txt])=>'<button class="tab '+(state.activeTab===id?'active':'')+'" onclick="navTo(\''+id+'\')"><span>'+ic+'</span>'+txt+'</button>').join('')}
function brand(){return '<div class="brand"><div class="logo"><b>N</b>NAVO Services</div><span class="muted">⚙</span></div>'}
function home(){const m=state.master,near=sortBookings(state.bookings.filter(future)).slice(0,3);return brand()+'<h1 class="h1">Кабинет мастера</h1><div class="profile-head"><div class="avatar">'+safe(m.name.slice(0,1))+'</div><div><div class="name">'+safe(m.name)+'</div><div class="addr">📍 '+safe(m.address)+'</div><div class="rating">★ '+Number(m.rating).toFixed(1)+'</div></div></div><div class="profile-actions"><span class="pending">'+(m.status==='active'?'✓ Активен':'◷ На проверке')+'</span><button class="outline" onclick="toast(\'Просмотр глазами клиента будет подключён\')">◎ Как видит клиент</button></div><div class="metrics"><button class="metric" onclick="state.filter=\'today\';navTo(\'bookings\')"><span class="symbol">▣</span><label>Сегодня</label><strong>'+state.bookings.filter(b=>isToday(b)&&b.status!=='cancelled').length+'</strong></button><button class="metric" onclick="navTo(\'chats\')"><span class="symbol">☏</span><label>Чаты</label><strong>'+convCount()+(unread()?' •'+unread():'')+'</strong></button><div class="metric balance"><span class="symbol">▤</span><label>Баланс</label><strong>'+amount()+' TJS</strong></div></div><div class="row-title"><h2>Ближайшие записи</h2><button class="link" onclick="navTo(\'bookings\')">Все ›</button></div><div class="mini-list">'+(near.length?near.map(b=>'<button class="mini" onclick="navTo(\'bookings\',\''+b.id+'\')"><div class="time">'+safe(b.time)+'</div><div class="client">'+safe(b.clientName||b.clientPhone)+'</div><div class="service">'+safe(b.serviceName)+'</div><span class="badge">Подтверждено</span></button>').join(''):'<div class="empty">Нет ближайших записей</div>')+'</div><button class="primary" onclick="newBooking()">＋ Новая запись</button>'}
function bookingCard(b){return '<article class="booking" id="booking-'+safe(b.id)+'"><div class="booking-main"><div class="book-time">'+safe(b.time)+'<small>'+Number(b.durationMinutes)+' мин</small></div><div><div class="book-name">'+safe(b.clientName||b.clientPhone)+'</div><div class="muted" style="font-size:12px">'+safe(b.clientPhone)+'</div><div class="book-service">'+safe(b.serviceName)+'</div><div class="price">'+Number(b.price)+' TJS</div><span class="badge '+safe(b.status)+'">'+({confirmed:'Подтверждена',completed:'Завершена',cancelled:'Отменена'}[b.status]||'Запись')+'</span></div></div><div class="book-actions"><button onclick="call(\''+b.id+'\')">☎ Звонок</button><button onclick="openChat(\''+b.id+'\')">☏ Чат</button><button onclick="openChat(\''+b.id+'\')">Подробнее ›</button></div><div class="book-extra"><span class="muted" style="font-size:12px">Статус записи</span><select aria-label="Статус записи" onchange="statusBooking(\''+b.id+'\',this.value)"><option value="confirmed" '+(b.status==='confirmed'?'selected':'')+'>Подтверждена</option><option value="completed" '+(b.status==='completed'?'selected':'')+'>Завершена</option><option value="cancelled" '+(b.status==='cancelled'?'selected':'')+'>Отменена</option></select></div></article>'}
function bookings(){const f=state.filter,bs=sortBookings(state.bookings.filter(b=>f==='today'?isToday(b)&&b.status==='confirmed':f==='upcoming'?future(b)&&!isToday(b):b.status!=='confirmed'||b.date<today()));const groups={};bs.forEach(b=>(groups[b.date]??=[]).push(b));return brand()+'<h1 class="h1">Записи</h1><div class="segments">'+[['today','Сегодня'],['upcoming','Предстоящие'],['history','История']].map(([id,label])=>'<button class="segment '+(f===id?'active':'')+'" onclick="state.filter=\''+id+'\';save();render()">'+label+(id==='today'?' ('+state.bookings.filter(b=>isToday(b)&&b.status==='confirmed').length+')':id==='upcoming'?' ('+state.bookings.filter(b=>future(b)&&!isToday(b)).length+')':'')+'</button>').join('')+'</div>'+(bs.length?Object.entries(groups).map(([d,arr])=>'<div class="day">'+safe(fmtDate(d))+'</div>'+arr.map(bookingCard).join('')).join(''):'<div class="empty" style="margin-top:22px">Записей пока нет</div>')+'<button class="primary" onclick="newBooking()">＋ Запись</button>'}
function chats(){const ids=Object.keys(state.chats).filter(id=>state.chats[id].length&&state.bookings.some(b=>b.id===id));return brand()+'<h1 class="h1">Чаты</h1>'+(ids.length?ids.map(id=>{const b=state.bookings.find(x=>x.id===id),ms=state.chats[id],u=ms.filter(x=>x.sender==='client'&&!x.isRead).length;return '<button class="chat-list-item" onclick="openChat(\''+id+'\')"><strong>'+safe(b.clientName||b.clientPhone)+(u?' 🟢 '+u:'')+'</strong><div class="muted">'+safe(ms[ms.length-1].text)+'</div></button>'}).join(''):'<div class="empty">Сообщений пока нет</div>')}
function profile(){const m=state.master;return brand()+'<h1 class="h1">Профиль</h1><div class="booking"><div class="name">'+safe(m.name)+'</div><p>'+safe(m.address)+'</p><p>'+safe(m.phone)+'</p><p>★ '+Number(m.rating).toFixed(1)+'</p><p>'+ (m.status==='active'?'Активен':'На проверке')+'</p></div><div class="demo">Демонстрационная версия: данные хранятся только в этом браузере</div>'}
function render(){const was=$('page').scrollTop;$('nav').innerHTML=navHtml();$('page').innerHTML=({home,bookings,chats,profile}[state.activeTab]||home)();$('page').scrollTop=was}
function openChat(id){const b=state.bookings.find(x=>x.id===id);if(!b)return;origin={tab:state.activeTab,scroll:$('page').scrollTop};state.activeChatBookingId=id;state.chats[id]??=[];state.chats[id].forEach(m=>{if(m.sender==='client')m.isRead=true});save();$('chatInfo').innerHTML='<div class="chat-person">Клиент: '+safe(b.clientName)+' ('+safe(b.clientPhone)+')</div><div class="chat-context">▣ '+safe(b.date)+' в '+safe(b.time)+' · '+safe(b.serviceName)+'</div>';$('callChat').onclick=()=>call(id);$('chatScreen').classList.add('open');$('nav').style.display='none';renderMessages()}
function backChat(){state.activeChatBookingId=null;save();$('chatScreen').classList.remove('open');$('nav').style.display='grid';if(origin){state.activeTab=origin.tab;render();$('page').scrollTop=origin.scroll;origin=null}else render()}
function renderMessages(){const id=state.activeChatBookingId;if(!id)return;const ms=state.chats[id]||[];$('messages').innerHTML=ms.map(m=>'<div class="bubble '+(m.sender==='master'?'mine':'')+'">'+safe(m.text)+'<div class="msg-time">'+new Date(m.timestamp).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+(m.sender==='master'?(m.isRead?' ✓✓':' ✓'):'')+'</div></div>').join('');$('quick').innerHTML=['Я в дороге','Буду через 5 мин','Опаздываю на 10 мин','Жду вас'].map(s=>'<button onclick="sendText(\''+s+'\')">'+s+'</button>').join('');$('messages').scrollTop=$('messages').scrollHeight}
function sendText(s){const id=state.activeChatBookingId;if(!id||!s.trim())return;state.chats[id]??=[];state.chats[id].push({id:'m'+Date.now()+Math.random().toString(36).slice(2),sender:'master',text:s.trim(),timestamp:new Date().toISOString(),isRead:false});save();renderMessages();$('messageInput').value=''}$('composer').addEventListener('submit',e=>{e.preventDefault();sendText($('messageInput').value)});
function statusBooking(id,status){const b=state.bookings.find(x=>x.id===id);if(!b)return;b.status=status;save();render();toast('Статус обновлён. Баланс пересчитан')}
function call(id){const b=state.bookings.find(x=>x.id===id);if(b?.clientPhone)location.href='tel:'+b.clientPhone.replace(/[^+\d]/g,'')}
function newBooking(){const name=prompt('Имя клиента');if(!name)return;const phone=prompt('Телефон клиента (+992...)')||'';const service=prompt('Услуга','Мужская стрижка')||'Мужская стрижка';const date=prompt('Дата (ГГГГ-ММ-ДД)',today());if(!/^\d{4}-\d{2}-\d{2}$/.test(date||'')){toast('Введите дату в формате ГГГГ-ММ-ДД');return}const time=prompt('Время (ЧЧ:ММ)','12:00');if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(time||'')){toast('Некорректное время');return}const price=Number(prompt('Стоимость, TJS','35'));if(!Number.isFinite(price)||price<0){toast('Некорректная цена');return}state.bookings.push({id:'b'+Date.now(),clientName:name,clientPhone:phone,serviceName:service,date,time,durationMinutes:45,price,status:'confirmed'});save();navTo('bookings');toast('Запись добавлена')}
window.addEventListener('storage',e=>{if(e.key!==KEY||!e.newValue)return;try{const updated=JSON.parse(e.newValue);if(!updated?.master||!updated?.bookings)return;const open=state.activeChatBookingId;state=updated;state.activeChatBookingId=open;render();if(open)renderMessages()}catch(e){}});window.addEventListener('online',()=>toast('Соединение восстановлено'));window.addEventListener('offline',()=>toast('Нет связи с сервером. Повторная попытка...'));render();
</script></body></html>

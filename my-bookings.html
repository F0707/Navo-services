<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAVO — Мои записи</title><style>body{margin:0;background:#f4f7f1;color:#173f35;font:16px system-ui}header{background:#fff;padding:20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d8e1d7}h1{font-size:26px}main{max-width:700px;margin:auto;padding:22px}a{color:#173f35;text-decoration:none;font-weight:700;border:1px solid #c5d5c5;padding:12px;border-radius:13px;background:white}.card{padding:20px;background:white;border:1px solid #d6e3d5;border-radius:18px;margin:14px 0;line-height:1.6}.muted{color:#65766c}button{background:#173f35;color:white;padding:14px;border:0;border-radius:12px;font:inherit}</style></head><body><header><strong style="font-size:26px">navo•</strong><a href="./?v=64">← Найти мастера</a></header><main><h1>Мои записи</h1><p class="muted">Записи вашего подтверждённого аккаунта NAVO</p><div id="status" class="card">Загружаем…</div><div id="records"></div><p><a href="./?v=64">⌂ На главную</a></p></main><script>(async()=>{const status=document.getElementById('status'),list=document.getElementById('records');const ROOT='https://wvixivswjqxyunpoiqrl.supabase.co',KEY='sb_publishable_5rU0FOrKI2HO_kYI-FGYmQ_9Gxq3SwP';try{let a=JSON.parse(localStorage.getItem('navo-auth-session-v43')||sessionStorage.getItem('navo-auth-session-v43')||'null');if(!a?.access_token){status.textContent='Вы не вошли в аккаунт. Вернитесь на главную и войдите по SMS.';return}const get=async path=>{const r=await fetch(ROOT+path,{headers:{apikey:KEY,Authorization:'Bearer '+a.access_token}});const j=await r.json();if(!r.ok)throw Error(j.msg||j.message||'Ошибка '+r.status);return j};const u=await get('/auth/v1/user');const rows=await get('/rest/v1/bookings?select=id,starts_at,status,total_somoni&client_id=eq.'+encodeURIComponent(u.id)+'&order=starts_at.desc&limit=100');status.textContent=rows.length?'Найдено записей: '+rows.length:'Пока нет облачных записей';for(const b of rows){const d=document.createElement('div');d.className='card';d.textContent=new Date(b.starts_at).toLocaleString('ru-RU')+' · '+b.status+' · '+b.total_somoni+' сомони';list.append(d)}}catch(e){status.textContent='Не удалось загрузить записи: '+e.message}})();</script></body></html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NAVO — Клиент</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f9f8;color:#152d25;font-family:system-ui,-apple-system,Arial}.app{max-width:448px;margin:auto;min-height:100dvh;background:#f8faf9;padding:22px 16px 108px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 25px}.logo{font-size:32px;font-weight:700;color:#064e3b}.topright{display:flex;align-items:center;gap:8px}.city{max-width:170px;padding:12px 5px;border:0;background:transparent;font-size:14px;color:#26352f}.master{border:0;background:#047857;color:#fff;border-radius:50%;width:40px;height:40px;font-weight:800}.searchrow{display:flex;gap:9px}.search{border:1px solid #dce2df;background:#fff;border-radius:12px;padding:14px;width:100%;min-width:0;font-size:14px}.filter{border:1px solid #dce2df;border-radius:12px;background:#fff;color:#047857;font-size:22px;width:50px}.chips{display:flex;gap:9px;overflow:auto;margin:18px -16px 26px;padding:0 16px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid #d7deda;border-radius:25px;background:#fff;padding:10px 16px;color:#28372f}.chip.on{background:#e8f0ec;border-color:#e8f0ec;color:#047857}.heading{font-size:23px;margin:20px 0 18px;color:#101b16}.card{position:relative;background:#fff;border-radius:18px;padding:15px;margin:12px 0;box-shadow:0 4px 18px #102a1a12}.cardtop{display:flex;gap:14px}.avatar{background:#d9eee4;color:#047857;border-radius:13px;width:112px;height:112px;flex-shrink:0;display:grid;place-items:center;font-size:46px;font-weight:700}.details{min-width:0;flex:1;padding-right:24px}.details strong{font-size:18px}.rating{background:#f4f5f4;display:inline-block;padding:4px 7px;border-radius:15px;margin:7px 0;font-size:13px}.addr{font-size:13px;color:#7b8580}.star{position:absolute;right:13px;top:10px;background:transparent;border:0;font-size:28px;color:#c2c8c5}.star.on{color:#d4a017}.cardfoot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:17px}.primary{background:#047857;color:white;border:0;border-radius:25px;padding:12px 18px;font-weight:650;font-size:15px}.wide{width:100%;border-radius:13px;padding:15px;margin-top:12px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:448px;display:grid;grid-template-columns:repeat(4,1fr);background:#fffc;backdrop-filter:blur(14px);border-top:1px solid #f3f4f6;box-shadow:0 -5px 20px #0001;border-radius:18px 18px 0 0;padding:10px 0 max(10px,env(safe-area-inset-bottom))}.nav button{border:0;background:none;color:#9ca3af;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;position:relative}.nav button.on{color:#047857;font-weight:800}.nav svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}.count{position:absolute;top:-5px;left:calc(50% + 8px);border-radius:15px;background:#704630;color:white;padding:2px 5px;font-size:10px}.panel{background:#fff;border-radius:18px;padding:18px;margin-top:15px}.field{display:block;margin:14px 0;font-weight:650}.field input{display:block;width:100%;border:1px solid #d6dfd9;border-radius:12px;padding:14px;font:inherit;margin-top:8px}.muted{color:#78847c;font-size:13px}.back{border:0;background:none;color:#047857;font-weight:650;padding:12px 0}.overlay{position:fixed;inset:0;background:#0008;display:grid;place-items:end center;z-index:50}.sheet{width:100%;max-width:448px;background:#fff;padding:24px;border-radius:22px 22px 0 0}.sheet a{display:block;padding:14px;margin:12px 0;background:#eaf5ef;border-radius:12px;color:#047857;text-align:center;text-decoration:none}.empty{padding:36px 10px;text-align:center;color:#7c8981}.work{display:flex;gap:8px;overflow:auto}.work span{background:#eaf5ef;border-radius:12px;padding:25px;color:#52725e;min-width:120px}
</style></head><body><main class="app"><div id="root"></div></main><nav class="nav" id="nav"></nav><div id="modal"></div><script>
(()=>{'use strict';const key='navo_clean_client_v1';let db;try{db=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){db={}}db.bookings||=[];db.favs||=[];db.profile||={};let tab='catalog',detail=false,filter='Все',search='',selected=[],date='',time='',region='Душанбе';const services=[['Мужская стрижка',20],['Оформление бороды',15],['Укладка',10]];const master={id:'obidov',name:'Обидов',address:'Душанбе, пр. Рудаки 100'};const regions={'Душанбе':['Весь Душанбе','Сино','Фирдавси','Шохмансур','Исмоили Сомони'],'Согдийская область':['Худжанд','Истаравшан','Исфара','Пенджикент','Конибодом','Ашт','Айни','Бободжон Гафуров','Спитамен','Шахристон'],'Хатлонская область':['Бохтар','Куляб','Нурек','Дангара','Ёвон','Вахш','Фархор','Восе','Кубодиён','Шахритус'],'ГБАО':['Хорог','Мургаб','Рушан','Шугнан','Ишкашим','Ванч','Дарвоз'],'Районы республиканского подчинения':['Вахдат','Гиссар','Турсунзаде','Рогун','Рудаки','Варзоб','Рашт','Файзабад','Шахринав','Нуробод','Лахш']};const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(key,JSON.stringify(db))}const icons={catalog:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',bookings:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',favorites:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/>',profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'};function header(){return '<header class="top"><div class="logo">NAVO</div><div class="topright"><select class="city" id="region">'+Object.entries(regions).map(([k,v])=>'<optgroup label="'+k+'"><option>'+k+'</option>'+v.map(x=>'<option>'+k+' — '+x+'</option>').join('')+'</optgroup>').join('')+'</select><button class="master" id="master">М</button></div></header>'}function star(){return '<button class="star '+(db.favs.includes(master.id)?'on':'')+'" id="star">'+(db.favs.includes(master.id)?'★':'☆')+'</button>'}function card(){return '<div class="card"><div class="cardtop"><div class="avatar">О</div><div class="details"><strong>Обидов (Барбер)</strong><div class="rating">★ 5.0 · демо</div><div class="addr">⌖ '+master.address+'</div></div></div>'+star()+'<div class="cardfoot"><span>от 20 TJS</span><button class="primary" id="book">Забронировать</button></div></div>'}function catalog(){return header()+'<div class="searchrow"><input class="search" id="search" placeholder="Поиск услуг и мастеров..." value="'+esc(search)+'"><button class="filter" id="filters">☷</button></div><div class="chips">'+['Все','Стрижки','Борода','Барбершопы'].map(x=>'<button class="chip '+(filter===x?'on':'')+'" data-filter="'+x+'">'+x+'</button>').join('')+'</div><h2 class="heading">Популярные мастера</h2>'+(!search||'обидов барбер стрижки борода'.includes(search.toLowerCase())?card():'<div class="empty">Мастера не найдены</div>')+'<p class="muted">Демонстрационный каталог: данные мастера и рейтинг примерные.</p>'}function bookings(){return header()+'<h2 class="heading">Мои записи</h2>'+(db.bookings.length?db.bookings.slice().reverse().map(b=>'<div class="panel"><b>'+esc(b.services)+'</b><p>Мастер: Обидов</p><p>'+esc(b.date)+' · '+esc(b.time)+'</p><p>Стоимость: '+b.total+' TJS</p><h2>PIN: '+b.pin+'</h2></div>').join(''):'<div class="empty">У вас пока нет записей</div>')}function favorites(){return header()+'<h2 class="heading">Избранное</h2>'+(db.favs.includes(master.id)?card():'<div class="empty">Нажмите ☆ на карточке мастера, чтобы сохранить его.</div>')}function profile(){const p=db.profile;return header()+'<h2 class="heading">Профиль клиента</h2><div class="panel"><label class="field">Имя<input id="name" value="'+esc(p.name)+'" placeholder="Ваше имя"></label><label class="field">Телефон<input id="phone" type="tel" value="'+esc(p.phone)+'" placeholder="+992..."></label><label class="field">Почта<input id="email" type="email" value="'+esc(p.email)+'" placeholder="example@gmail.com"></label><button class="primary wide" id="saveprofile">Сохранить профиль</button><p class="muted">История записей: '+db.bookings.length+'</p><button class="primary wide" id="masterprofile">Войти как мастер</button></div>'}function details(){return '<button class="back" id="back">← Назад в каталог</button><button class="back" id="share" style="float:right">Поделиться</button><div class="panel"><div class="avatar" style="width:100%;height:150px">О</div><h2>Обидов · Барбер</h2><p>★ 5.0 (демонстрационный рейтинг)</p><p>⌖ '+master.address+'</p><p>Ориентир: уточняется у мастера</p><a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(master.address)+'" target="_blank" rel="noopener">Построить маршрут</a><h3>Портфолио</h3><div class="work"><span>Фото работ пока нет</span></div><h3>Услуги</h3>'+services.map((x,i)=>'<label class="field"><input type="checkbox" data-service="'+i+'" '+(selected.includes(i)?'checked':'')+'> '+x[0]+' — '+x[1]+' TJS</label>').join('')+'<label class="field">Дата<input id="date" type="date" value="'+date+'"></label><label class="field">Время<input id="time" type="time" value="'+time+'"></label><h3 id="total">Итого: '+selected.reduce((a,i)=>a+services[i][1],0)+' TJS</h3><button class="primary wide" id="confirm">Записаться к этому мастеру</button></div>'}function render(){const count=db.bookings.length;$('nav').innerHTML=[['catalog','Категории'],['bookings','Записи'],['favorites','Избранное'],['profile','Профиль']].map(([id,label])=>'<button data-tab="'+id+'" class="'+(tab===id?'on':'')+'"><svg viewBox="0 0 24 24">'+icons[id]+'</svg>'+label+(id==='bookings'&&count?'<span class="count">'+count+'</span>':'')+'</button>').join('');$('root').innerHTML=detail?details():({catalog,bookings,favorites,profile}[tab])();if($('region'))$('region').value=region;bind()}function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;detail=false;render();window.scrollTo(0,0)});if($('region'))$('region').onchange=e=>region=e.target.value;if($('master'))$('master').onclick=masterModal;if($('masterprofile'))$('masterprofile').onclick=masterModal;if($('star'))$('star').onclick=()=>{db.favs=db.favs.includes(master.id)?db.favs.filter(x=>x!==master.id):[...db.favs,master.id];save();render()};if($('book'))$('book').onclick=()=>{detail=true;render()};if($('back'))$('back').onclick=()=>{detail=false;tab='catalog';render()};if($('share'))$('share').onclick=()=>{if(navigator.share)navigator.share({title:'NAVO — Обидов',url:location.href});else alert('Ссылка: '+location.href)};if($('search'))$('search').oninput=e=>{search=e.target.value;const p=e.target.selectionStart;render();$('search').focus();$('search').setSelectionRange(p,p)};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});if($('filters'))$('filters').onclick=()=>alert('Выбор города и района находится в верхнем меню');document.querySelectorAll('[data-service]').forEach(b=>b.onchange=()=>{selected=[...document.querySelectorAll('[data-service]:checked')].map(x=>Number(x.dataset.service));$('total').textContent='Итого: '+selected.reduce((a,i)=>a+services[i][1],0)+' TJS'});if($('date'))$('date').onchange=e=>date=e.target.value;if($('time'))$('time').onchange=e=>time=e.target.value;if($('confirm'))$('confirm').onclick=()=>{if(!selected.length||!date||!time){alert('Выберите услугу, дату и время');return}db.bookings.push({id:Date.now(),services:selected.map(i=>services[i][0]).join(', '),total:selected.reduce((a,i)=>a+services[i][1],0),date,time,pin:String(Math.floor(1000+Math.random()*9000))});save();detail=false;tab='bookings';selected=[];render()};if($('saveprofile'))$('saveprofile').onclick=()=>{db.profile={name:$('name').value,phone:$('phone').value,email:$('email').value};save();alert('Профиль сохранён')}}function masterModal(){$('modal').innerHTML='<div class="overlay"><div class="sheet"><h2>Вход мастера</h2><p>Кабинет мастера работает отдельно от клиентского каталога.</p><a href="https://f0707.github.io/Navo-services/">Открыть основное NAVO для входа и регистрации</a><button class="primary wide" id="close">Вернуться к клиенту</button></div></div>';$('close').onclick=()=>$('modal').innerHTML=''}render()})();
</script></body></html>

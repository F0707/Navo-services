-left:4px solid #008055;border-radius:16px;padding:14px 10px;min-height:180px;box-shadow:0 7px 17px #1a342219}.mini .time{font-size:20px;font-weight:850}.mini .client{font-size:18px;font-weight:800;margin:16px 0 6px}.mini .service{font-size:12px;color:#67756e;min-height:35px}.badge{display:inline-block;border-radius:20px;padding:6px 8px;background:#daf6e4;color:#146b41;font-size:11px;font-weight:750}.badge.cancelled{background:#f8e0e0;color:#9a4444}.badge.completed{background:#e5e8f3;color:#52618b}.primary{width:100%;background:#006e4b;color:white;border:0;border-radius:15px;padding:16px;font-weight:800;font-size:18px;margin-top:24px}.segments{display:grid;grid-template-columns:1fr 1.35fr .85fr;background:#e5e9eb;border-radius:16px;padding:4px;gap:2px}.segment{border:0;border-radius:13px;background:transparent;color:#66746c;padding:12px 2px;font-size:12px}.segment.active{background:#008050;color:white;font-weight:800}.day{font-size:17px;font-weight:800;color:#4b5c54;margin:24px 0 12px}.booking{background:white;border-radius:17px;padding:15px 13px 0;margin-bottom:12px;box-shadow:0 5px 17px #153f2b13;scroll-margin-top:15px}.booking-main{display:grid;grid-template-columns:83px minmax(0,1fr);gap:12px}.book-time{font-size:22px;font-weight:850;border-right:1px solid #e0e7e3}.book-time small{display:block;font-size:12px;color:#86928a;font-weight:400;margin-top:8px}.book-name{font-weight:800;font-size:14px;overflow-wrap:anywhere}.book-service{font-size:13px;color:#687970;margin:9px 0}.price{font-size:19px;font-weight:850;color:#00754b}.book-actions{border-top:1px solid #e6ede9;display:grid;grid-template-columns:repeat(3,1fr);margin-top:13px}.book-actions button{border:0;background:transparent;padding:14px 1px;color:#08754d;font-size:13px}.book-actions button+button{border-left:1px solid #e6ede9}.book-extra{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #edf1ef;padding:10px 0}.book-extra select{border:1px solid #d3dfd7;border-radius:9px;padding:8px;font-size:12px;max-width:150px;background:white}.tabs{position:absolute;bottom:0;width:100%;display:grid;grid-template-columns:repeat(4,1fr);background:white;box-shadow:0 -5px 19px #133c2b13;border-radius:22px 22px 0 0;padding:12px 3px max(12px,env(safe-area-inset-bottom));z-index:4}.tab{border:0;background:none;color:#758179;font-size:12px}.tab span{display:block;font-size:23px;margin-bottom:3px}.tab.active{color:#00784c;font-weight:850}.chat-screen{position:absolute;inset:0;background:#f7f9fa;display:none;flex-direction:column;z-index:8}.chat-screen.open{display:flex}.chat-top{background:linear-gradient(110deg,#008158,#005d43);color:white;display:flex;align-items:center;justify-content:space-between;padding:22px 13px}.chat-top strong{font-size:20px}.chat-top button{border:0;background:transparent;color:white;font-size:25px}.chat-info{background:white;border-radius:0 0 22px 22px;padding:15px;box-shadow:0 5px 14px #143e2710}.chat-person{font-size:17px;font-weight:800;overflow-wrap:anywhere}.chat-context{display:inline-block;background:#e0f7e9;color:#286747;border-radius:22px;padding:9px;margin-top:10px;font-size:12px}.messages{flex:1;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:22px 13px}.bubble{max-width:85%;padding:12px 14px;border-radius:17px;background:#e9ebee;align-self:flex-start;line-height:1.4;overflow-wrap:anywhere}.bubble.mine{background:#006e4b;color:white;align-self:flex-end}.msg-time{font-size:11px;text-align:right;opacity:.75;margin-top:5px}.chat-footer{padding:10px 12px max(13px,env(safe-area-inset-bottom))}.quick{display:flex;gap:8px;overflow:auto;padding-bottom:11px}.quick button{white-space:nowrap;border:1px solid #b8d9c8;border-radius:20px;background:#e9f8ef;color:#175c3d;padding:9px 12px}.composer{display:flex;gap:9px}.composer input{min-width:0;flex:1;border:1px solid #d7e1db;border-radius:28px;background:white;padding:13px 16px;outline:none}.composer button{border:0;background:#00935c;color:white;border-radius:50% </style><style>.master-shortcut{height:42px;width:42px;flex:none;border:0;border-radius:50%;background:#007b50;color:white;font-size:14px;font-weight:900;box-shadow:0 4px 12px #007b5033}.client-header .city{max-width:190px;width:clamp(115px,31vw,190px);font-size:12px}.tabs .tab span{display:flex;align-items:center;justify-content:center;height:28px}.tabs .tab{font-size:11px}.tabs .tab svg{display:block}</style><style>.fav-star{position:absolute;right:15px;top:10px;width:42px;height:42px;border:1px solid #c8ddd2;border-radius:50%;background:white;color:#078052;font-size:32px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:2}.fav-star.is-favorite{color:#d49b08;background:#fff9e9;border-color:#f2d57d}.client-header .city{width:clamp(110px,34vw,195px);max-width:195px;text-overflow:ellipsis}</style><style>.favorite-star{position:absolute;right:18px;top:18px;width:42px;height:42px;border:1px solid #b8d4c6;border-radius:12px;background:white;color:#087b53;font-size:30px}.favorite-star.chosen{color:#d5a000;background:#fff7d8}.master-card-top h2{padding-right:45px}</style><style>.entry-overlay{position:fixed;inset:0;background:#0009;z-index:99999;display:flex;align-items:flex-end;justify-content:center}.entry-sheet{background:white;border-radius:24px 24px 0 0;width:100%;max-width:448px;padding:30px 22px 42px;position:relative;color:#142b23}.entry-sheet h2{font-size:25px;margin:0 0 12px}.entry-sheet p{font-size:15px}.entry-close{position:absolute;right:18px;top:12px;font-size:30px;border:0;background:transparent}.entry-main,.entry-outline,.entry-demo{display:block;width:100%;padding:17px 10px;border-radius:13px;text-align:center;font-size:16px;font-weight:700;margin:12px 0;text-decoration:none}.entry-main{background:#006d4c;color:white}.entry-outline{background:#e7f5ee;color:#006d4c;border:1px solid #9bcab6}.entry-demo{background:white;border:1px solid #c5d3cd;color:#42594f}.entry-note{color:#6a7772;font-size:12px!important;line-height:1.5}</style><style>.app{max-width:448px}.navo-client-bottom{position:absolute!important;bottom:0!important;left:0;right:0;width:100%;max-width:448px;margin:auto;display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;height:82px!important;padding:8px 2px max(8px,env(safe-area-inset-bottom))!important;background:rgba(255,255,255,.96)!important;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 -8px 26px rgba(15,23,42,.065)!important;border-top:1px solid #f3f4f6!important;border-radius:18px 18px 0 0;z-index:40}.navo-client-bottom .client-tab{min-width:0;background:none;border:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;color:#9ca3af;font-size:11px;font-weight:500;transition:color .2s ease;position:relative;padding:3px 0}.navo-client-bottom .client-tab.active{color:#047857;font-weight:800}.client-tab-icon{position:relative;display:inline-flex;align-items:center;justify-content:center;height:29px}.client-count{position:absolute;top:-7px;right:-11px;min-width:19px;height:19px;border-radius:100px;background:#6b3e2b;color:#fff;font-size:11px;line-height:19px;text-align:center;padding:0 3px;border:2px solid #fff;box-sizing:content-box}.client-active-dot{width:4px;height:4px;border-radius:50%;background:#047857;position:absolute;bottom:-2px}.client-tab-label{white-space:nowrap}.client-profile-extra{margin-top:24px;padding-top:16px;border-top:1px solid #e5e7eb}.client-profile-extra h3{font-size:17px}.client-profile-extra .entry-outline,.client-profile-extra .entry-main{font-size:14px;padding:14px 8px}</style></head><body><main class="app"><div class="toast" id="toast"></div><div class="page" id="page"></div><nav class="tabs" id="nav"></nav><section class="chat-screen" id="chatScreen"><div class="chat-top"><button onclick="backChat()" aria-label="Назад">←</button><strong>Чат по записи</strong><button id="callChat" aria-label="Позвонить">☎</button></div><div class="chat-info" id="chatInfo"></div><div class="messages" id="messages"></div><div class="chat-footer"><div class="quick" id="quick"></div><form class="composer" id="composer"><input id="messageInput" placeholder="Сообщение..." maxlength="500" autocomplete="off"><button type="submit" aria-label="Отправить">➤</button></form></div></section></main><script>
'use strict';
const KEY='navo-master-spa-preview-v1',tz='Asia/Dushanbe';const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const dayShift=n=>{const d=new Date(today()+'T12:00:00+05:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const seed=()=>({master:{id:'demo-master',name:'Обидов',phone:'+992 91 960-32-02',address:'Душанбе, пр. Рудаки 100',rating:5,status:'pending',balance:450},bookings:[{id:'b1',clientPhone:'+992 98 106-11-71',clientName:'Алишер',serviceName:'Стрижка и борода',date:today(),time:'13:30',durationMinutes:45,price:35,status:'confirmed'},{id:'b2',clientPhone:'+992 91 960-32-02',clientName:'Парвиз',serviceName:'Мужская стрижка',date:dayShift(1),time:'12:00',durationMinutes:45,price:40,status:'confirmed'},{id:'b3',clientPhone:'+992 93 555-11-22',clientName:'Фаррух',serviceName:'Стрижка и оформление',date:dayShift(2),time:'15:00',durationMinutes:30,price:35,status:'confirmed'}],chats:{b1:[{id:'m1',sender:'client',text:'Здравствуйте! Я на месте, у входа.',timestamp:new Date().toISOString(),isRead:true},{id:'m2',sender:'master',text:'Здравствуйте! Проходите, я готов.',timestamp:new Date().toISOString(),isRead:true}]},activeTab:'home',activeChatBookingId:null,filter:'today',baseBalance:450});
let state;try{state=JSON.parse(localStorage.getItem(KEY))||seed();if(!state.master||!Array.isArray(state.bookings)||!state.chats)state=seed()}catch(e){state=seed()}state.activeChatBookingId=null;let origin=null,scrollPositions={},toastTimer;
const $=id=>document.getElementById(id),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',3000)}
const isToday=b=>b.date===today(),future=b=>b.date>=today()&&b.status==='confirmed',sortBookings=a=>[...a].sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));const amount=()=>Number(state.baseBalance||0)+state.bookings.filter(b=>b.status==='completed').reduce((s,b)=>s+Number(b.price||0),0);const unread=()=>Object.values(state.chats).flat().filter(m=>m.sender==='client'&&!m.isRead).length;const convCount=()=>Object.values(state.chats).filter(v=>v.length).length;
function fmtDate(d){return new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}function navTo(tab,bookingId){if(state.activeChatBookingId)backChat();scrollPositions[state.activeTab]=$('page').scrollTop;state.activeTab=tab;if(tab==='bookings'&&bookingId){state.filter=isToday(state.bookings.find(b=>b.id===bookingId)||{})?'today':'upcoming'}save();render();if(bookingId){requestAnimationFrame(()=>{const el=document.getElementById('booking-'+bookingId);el?.scrollIntoView({block:'center',behavior:'smooth'})})}else $('page').scrollTop=scrollPositions[tab]||0}
function navHtml(){return [['home','⌂','Главная'],['bookings','▣','Записи'],['chats','☏','Чаты'],['profile','♙','Профиль']].map(([id,ic,txt])=>'<button class="tab '+(state.activeTab===id?'active':'')+'" onclick="navTo(\''+id+'\')"><span>'+ic+'</span>'+txt+'</button>').join('')}
function brand(){return '<div class="brand"><div class="logo"><b>N</b>NAVO Services</div><span class="muted">⚙</span></div>'}
function home(){const m=state.master,near=sortBookings(state.bookings.filter(future)).slice(0,3);return brand()+'<h1 class="h1">Кабинет мастера</h1><div class="profile-head"><div class="avatar">'+safe(m.name.slice(0,1))+'</div><div><div class="name">'+safe(m.name)+'</div><div class="addr">📍 '+safe(m.address)+'</div><div class="rating">★ '+Number(m.rating).toFixed(1)+'</div></div></div><div class="profile-actions"><span class="pending">'+(m.status==='active'?'✓ Активен':'◷ На проверке')+'</span></div><div class="metrics"><button class="metric" onclick="state.filter=\'today\';navTo(\'bookings\')"><span class="symbol">▣</span><label>Сегодня</label><strong>'+state.bookings.filter(b=>isToday(b)&&b.status!=='cancelled').length+'</strong></button><button class="metric" onclick="navTo(\'chats\')"><span class="symbol">☏</span><label>Чаты</label><strong>'+convCount()+(unread()?' •'+unread():'')+'</strong></button><div class="metric balance"><span class="symbol">▤</span><label>Баланс</label><strong>'+amount()+' TJS</strong></div></div><div class="row-title"><h2>Ближайшие записи</h2><button class="link" onclick="navTo(\'bookings\')">Все ›</button></div><div class="mini-list">'+(near.length?near.map(b=>'<button class="mini" onclick="navTo(\'bookings\',\''+b.id+'\')"><div class="time">'+safe(b.time)+'</div><div class="client">'+safe(b.clientName||b.clientPhone)+'</div><div class="service">'+safe(b.serviceName)+'</div><span class="badge">Подтверждено</span></button>').join(''):'<div class="empty">Нет ближайших записей</div>')+'</div><button class="primary" onclick="newBooking()">＋ Новая запись</button>'}
function bookingCard(b){return '<article class="booking" id="booking-'+safe(b.id)+'"><div class="booking-main"><div class="book-time">'+safe(b.time)+'<small>'+Number(b.durationMinutes)+' мин</small></div><div><div class="book-name">'+safe(b.clientName||b.clientPhone)+'</div><div class="muted" style="font-size:12px">'+safe(b.clientPhone)+'</div><div class="book-service">'+safe(b.serviceName)+'</div><div class="price">'+Number(b.price)+' TJS</div><span class="badge '+safe(b.status)+'">'+({confirmed:'Подтверждена',completed:'Завершена',cancelled:'Отменена'}[b.status]||'Запись')+'</span></div></div><div class="book-actions"><button onclick="call(\''+b.id+'\')">☎ Звонок</button><button onclick="openChat(\''+b.id+'\')">☏ Чат</button><button onclick="openChat(\''+b.id+'\')">Подробнее ›</button></div><div class="book-extra"><span class="muted" style="font-size:12px">Статус записи</span><select aria-label="Статус записи" onchange="statusBooking(\''+b.id+'\',this.value)"><option value="confirmed" '+(b.status==='confirmed'?'selected':'')+'>Подтверждена</option><option value="completed" '+(b.status==='completed'?'selected':'')+'>Завершена</option><option value="cancelled" '+(b.status==='cancelled'?'selected':'')+'>Отменена</option></select></div></article>'}
function bookings(){const f=state.filter,bs=sortBookings(state.bookings.filter(b=>f==='today'?isToday(b)&&b.status==='confirmed':f==='upcoming'?future(b)&&!isToday(b):b.status!=='confirmed'||b.date<today()));const groups={};bs.forEach(b=>(groups[b.date]??=[]).push(b));return brand()+'<h1 class="h1">Записи</h1><div class="segments">'+[['today','Сегодня'],['upcoming','Предстоящие'],['history','История']].map(([id,label])=>'<button class="segment '+(f===id?'active':'')+'" onclick="state.filter=\''+id+'\';save();render()">'+label+(id==='today'?' ('+state.bookings.filter(b=>isToday(b)&&b.status==='confirmed').length+')':id==='upcoming'?' ('+state.bookings.filter(b=>future(b)&&!isToday(b)).length+')':'')+'</button>').join('')+'</div>'+(bs.length?Object.entries(groups).map(([d,arr])=>'<div class="day">'+safe(fmtDate(d))+'</div>'+arr.map(bookingCard).join('')).join(''):'<div class="empty" style="margin-top:22px">Записей пока нет</div>')+'<button class="primary" onclick="newBooking()">＋ Запись</button>'}
function chats(){const ids=Object.keys(state.chats).filter(id=>state.chats[id].length&&state.bookings.some(b=>b.id===id));return brand()+'<h1 class="h1">Чаты</h1>'+(ids.length?ids.map(id=>{const b=state.bookings.find(x=>x.id===id),ms=state.chats[id],u=ms.filter(x=>x.sender==='client'&&!x.isRead).length;return '<button class="chat-list-item" onclick="openChat(\''+id+'\')"><strong>'+safe(b.clientName||b.clientPhone)+(u?' 🟢 '+u:'')+'</strong><div class="muted">'+safe(ms[ms.length-1].text)+'</div></button>'}).join(''):'<div class="empty">Сообщений пока нет</div>')}
function profile(){const m=state.master;return brand()+'<h1 class="h1">Профиль</h1><div class="booking"><div class="name">'+safe(m.name)+'</div><p>'+safe(m.address)+'</p><p>'+safe(m.phone)+'</p><p>★ '+Number(m.rating).toFixed(1)+'</p><p>'+ (m.status==='active'?'Активен':'На проверке')+'</p></div><div class="demo">Демонстрационная версия: данные хранятся только в этом браузере</div>'}
function render(){const was=$('page').scrollTop;$('nav').innerHTML=navHtml();$('page').innerHTML=({home,bookings,chats,profile}[state.activeTab]||home)();$('page').scrollTop=was}

function backChat(){state.activeChatBookingId=null;save();$('chatScreen').classList.remove('open');$('nav').style.display='grid';if(origin){state.activeTab=origin.tab;render();$('page').scrollTop=origin.scroll;origin=null}else render()}

function newBooking(){const name=prompt('Имя клиента');if(!name)return;const phone=prompt('Телефон клиента (+992...)')||'';const service=prompt('Услуга','Мужская стрижка')||'Мужская стрижка';const date=prompt('Дата (ГГГГ-ММ-ДД)',today());if(!/^\d{4}-\d{2}-\d{2}$/.test(date||'')){toast('Введите дату в формате ГГГГ-ММ-ДД');return}const time=prompt('Время (ЧЧ:ММ)','12:00');if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(time||'')){toast('Некорректное время');return}const price=Number(prompt('Стоимость, TJS','35'));if(!Number.isFinite(price)||price<0){toast('Некорректная цена');return}state.bookings.push({id:'b'+Date.now(),clientName:name,clientPhone:phone,serviceName:service,date,time,durationMinutes:45,price,status:'confirmed'});save();navTo('bookings');toast('Запись добавлена')}
window.addEventListener('storage',e=>{if(e.key!==KEY||!e.newValue)return;try{const updated=JSON.parse(e.newValue);if(!updated?.master||!updated?.bookings)return;const open=state.activeChatBookingId;state=updated;state.activeChatBookingId=open;render();if(open)renderMessages()}catch(e){}});window.addEventListener('online',()=>toast('Соединение восстановлено'));window.addEventListener('offline',()=>toast('Нет связи с сервером. Повторная попытка...'));
</script><script>
(function(){

const originalRender=render,originalNav=navTo,originalBookingCard=bookingCard,originalOpenChat=openChat,originalBackChat=backChat;
const services=[{name:'Мужская стрижка',price:20,duration:30},{name:'Стрижка и борода',price:35,duration:45},{name:'Оформление бороды',price:15,duration:20}];

function masterDetail(){return clientHeader()+'<button class="link" onclick="selectedMaster=false;render()">← Назад</button><div class="master-card" style="position:relative"><div class="master-card-top"><div class="avatar">О</div><div><h2>Обидов</h2><div class="rating">★ 5.0</div><div class="addr">Душанбе, пр. Рудаки 100</div></div></div><form onsubmit="bookClient(event)"><label class="field">Услуга<select id="serviceSelect">'+services.map((s,i)=>'<option value="'+i+'">'+safe(s.name)+' · '+s.price+' TJS</option>').join('')+'</select></label><label class="field">Дата<input id="clientDate" type="date" required min="'+today()+'" value="'+today()+'"></label><label class="field">Свободное время<select id="clientSlot">'+['09:00','10:00','11:00','12:00','13:30','15:00','16:00','17:00'].map(t=>'<option>'+t+'</option>').join('')+'</select></label><label class="field">Ваше имя<input id="clientName" placeholder="Имя клиента" required maxlength="80"></label><label class="field">Ваш телефон<input id="clientPhone" type="tel" placeholder="+992..." required maxlength="25"></label><button class="primary" type="submit">Подтвердить запись</button></form><p class="client-note">Доступность времени проверяется по записям в этом браузере.</p></div>'}
function clientBookings(){const bs=sortBookings(state.bookings.filter(b=>b.clientId===clientId()));return clientHeader()+'<h1 class="h1">Мои записи</h1>'+(bs.length?bs.map(b=>'<div class="client-book"><strong>'+safe(b.serviceName)+'</strong><p>Мастер: '+safe(state.master.name)+'</p><p>📅 '+safe(b.date)+' · '+safe(b.time)+'</p><p>Статус: '+({confirmed:'Подтверждена',completed:'Завершена',cancelled:'Отменена'}[b.status]||'Запись')+'</p><div class="pin">Код: '+safe(b.pin||'—')+'</div><div class="client-note">Покажите PIN мастеру после оказания услуги.</div><button class="primary" onclick="openChat(\''+b.id+'\')">Чат с мастером</button></div>').join(''):'<div class="empty">У вас пока нет записей</div>')}

window.uploadClientPhoto=function(input){const f=input.files?.[0];if(!f)return;if(f.size>1500000){toast('Выберите фото размером до 1,5 МБ');input.value='';return}const reader=new FileReader();reader.onload=()=>{const p=getClientProfile();p.photo=String(reader.result);try{localStorage.setItem('navo_client_profile',JSON.stringify(p));render();toast('Фото сохранено')}catch(e){toast('Недостаточно места для фотографии')}};reader.readAsDataURL(f)};

function navIcon(k){const p={grid:'<rect x="3" y="3" width="7" height="7" rx="1.4"/><rect x="14" y="3" width="7" height="7" rx="1.4"/><rect x="3" y="14" width="7" height="7" rx="1.4"/><rect x="14" y="14" width="7" height="7" rx="1.4"/>',house:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-7h6v7"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'};return '<svg viewBox="0 0 24 24" width="27" height="27" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+p[k]+'</svg>'}

$('nav').innerHTML=clientNav();$('nav').classList.add('navo-client-bottom');$('page').innerHTML=selectedMaster?masterDetail():clientTab==='mybookings'?clientBookings():clientTab==='clientprofile'?clientProfile():clientTab==='favorites'?favorites():catalog()};
openChat=function(id){const b=state.bookings.find(x=>x.id===id);if(!b)return;if(!isMaster()||preview){clientOrigin={tab:clientTab,selected:selectedMaster,scroll:$('page').scrollTop};origin={tab:state.activeTab,scroll:$('page').scrollTop}}originalOpenChat(id);if(!isMaster()||preview){$('chatInfo').innerHTML='<div class="chat-person">Мастер: '+safe(state.master.name)+'</div><div class="chat-context">▣ '+safe(b.date)+' в '+safe(b.time)+' · '+safe(b.serviceName)+'</div>'}};
backChat=function(){if(clientOrigin){state.activeChatBookingId=null;save();$('chatScreen').classList.remove('open');$('nav').style.display='grid';clientTab=clientOrigin.tab;selectedMaster=clientOrigin.selected;render();$('page').scrollTop=clientOrigin.scroll;clientOrigin=null;origin=null}else originalBackChat()};
sendText=function(s){const id=state.activeChatBookingId;if(!id||!s.trim())return;const sender=isMaster()&&!preview?'master':'client';state.chats[id]??=[];state.chats[id].push({id:'m'+Date.now()+Math.random().toString(36).slice(2),sender,text:s.trim(),timestamp:new Date().toISOString(),isRead:false});save();renderMessages();$('messageInput').value=''};
renderMessages=function(){const id=state.activeChatBookingId;if(!id)return;const own=isMaster()&&!preview?'master':'client';const ms=state.chats[id]||[];$('messages').innerHTML=ms.map(m=>'<div class="bubble '+(m.sender===own?'mine':'')+'">'+safe(m.text)+'<div class="msg-time">'+new Date(m.timestamp).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+(m.sender===own?(m.isRead?' ✓✓':' ✓'):'')+'</div></div>').join('');$('quick').innerHTML=['Я в дороге','Буду через 5 мин','Опаздываю на 10 мин','Жду вас'].map(s=>'<button onclick="sendText(\''+s+'\')">'+s+'</button>').join('');$('messages').scrollTop=$('messages').scrollHeight};
bookingCard=function(b){return originalBookingCard(b)+(b.pin?'<div class="client-note" style="margin:-9px 0 15px 12px">PIN клиента: <strong>'+safe(b.pin)+'</strong></div>':'')};
const oldStorageHandler=()=>{};window.addEventListener('storage',e=>{if(e.key===ROLE||e.key===MASTER){masterMode=false;clientTab='catalog';selectedMaster=false;render()}});
masterMode=false;sessionStorage.removeItem('navo_master_open_in_tab');localStorage.removeItem(ROLE);localStorage.removeItem(MASTER);preview=false;selectedMaster=false;clientTab='catalog';render();
})();
</script></body></html>

><button aria-label="Отправить">➤</button></form></div></div><div class="modal" id="modal"><div class="card"><h2>Завершение услуги</h2><p class="muted">Введите 4-значный код, который показывает клиент</p><form onsubmit="confirmPin(event)"><label class="field">PIN-код<input id="pinInput" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required placeholder="0000"></label><button class="primary">Подтвердить завершение</button><button type="button" class="outline" style="width:100%;margin-top:8px" onclick="document.getElementById('modal').classList.remove('open')">Отмена</button></form></div></div></main><script>
const $=id=>document.getElementById(id),K={role:'navo_role',bookings:'navo_bookings',chats:'navo_chats',balance:'navo_balance'},master={id:'obidov',name:'Обидов',phone:'+992 91 960-32-02',address:'Душанбе, пр. Рудаки 100',rating:5,status:'pending'},services=[{name:'Мужская стрижка',price:20,duration:30},{name:'Стрижка и борода',price:35,duration:45},{name:'Оформление бороды',price:15,duration:20}],icons={home:'<path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/>',bookings:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/>',chats:'<path d="M21 11a8 8 0 0 1-8 8H5l-2 2v-9a9 9 0 1 1 18-1Z"/>',profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',phone:'<path d="M6 3h4l1 5-2 2a15 15 0 0 0 5 5l2-2 5 1v4a3 3 0 0 1-3 3A17 17 0 0 1 3 6a3 3 0 0 1 3-3Z"/>',send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',back:'<path d="m15 18-6-6 6-6"/>',check:'<path d="m5 12 4 4L19 6"/>',star:'<path d="m12 2 3 7 7 .7-5.5 4.8 1.7 7.5-7.2-4-7.2 4 1.7-7.5L0 9.7 7 9z"/>'};function ico(n,size=19){return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(icons[n]||icons.home)+'</svg>'}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const read=(k,f)=>{try{const x=JSON.parse(localStorage.getItem(k));return x??f}catch{return f}};const dateToday=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Dushanbe',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const plusDay=n=>{const d=new Date(dateToday()+'T12:00:00+05:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};let role=localStorage.getItem(K.role);if(!['client','master'].includes(role)){role='client';localStorage.setItem(K.role,role)}let bookings=read(K.bookings,[]),chats=read(K.chats,{}),balance=Number(read(K.balance,450));if(!Number.isFinite(balance))balance=450;let tab=role==='master'?'home':'catalog',filter='today',chip='Все',query='',detail=false,preview=false,activeChat=null,returnFromChat=null,scrollByTab={},toastTimer;const clientId=()=>{let id=localStorage.getItem('navo_client_device');if(!id){id='c'+Math.random().toString(36).slice(2);localStorage.setItem('navo_client_device',id)}return id};const save=()=>{localStorage.setItem(K.bookings,JSON.stringify(bookings));localStorage.setItem(K.chats,JSON.stringify(chats));localStorage.setItem(K.balance,JSON.stringify(balance))};function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',2600)}function route(t){scrollByTab[tab]=$('page').scrollTop;tab=t;detail=false;render();$('page').scrollTop=scrollByTab[t]||0}function viewClient(){preview=true;tab='catalog';detail=false;render()}function backMaster(){preview=false;tab='home';render()}function loginMaster(){const code=prompt('Демо-вход мастера: введите NAVO');if(code!=='NAVO')return;role='master';localStorage.setItem(K.role,role);preview=false;tab='home';render()}function logout(){role='client';localStorage.setItem(K.role,role);preview=false;tab='catalog';render()}const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});const status=b=>({confirmed:'Подтверждена',completed:'Завершена',cancelled:'Отменена'}[b.status]||'Запись');const ordered=arr=>[...arr].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));const todayCount=()=>bookings.filter(b=>b.masterId===master.id&&b.date===dateToday()&&b.status==='confirmed').length;const chatCount=()=>Object.keys(chats).filter(id=>chats[id]?.length&&bookings.some(b=>b.id===id)).length;function brand(){return '<div class="brand"><div class="logo"><span>N</span>NAVO</div><span class="muted">Services · Душанбе</span></div>'}function nav(){const masterTabs=[['home','Главная'],['bookings','Записи'],['chats','Чаты'],['profile','Профиль']],clientTabs=[['catalog','Каталог'],['mybookings','Мои записи'],['profile','Профиль']];return '<nav class="tabs '+(role==='client'||preview?'client':'')+'">'+(role==='client'||preview?clientTabs:masterTabs).map(([id,label])=>'<button class="tab '+(tab===id?'active':'')+'" onclick="route(\''+id+'\')">'+ico(id==='catalog'?'home':id==='mybookings'?'bookings':id)+label+'</button>').join('')+'</nav>'}function bookingCard(b){return '<div class="card booking" id="booking-'+esc(b.id)+'"><div class="line"><div class="time">'+esc(b.time)+'<small>'+Number(b.durationMinutes||45)+' мин</small></div><div class="info"><strong>'+esc(b.clientName||b.clientPhone)+'</strong><div class="muted">'+esc(b.clientPhone)+'</div><div class="muted" style="margin-top:8px">'+esc(b.serviceName)+'</div><div class="price">'+Number(b.price)+' TJS</div><span class="badge '+esc(b.status)+'">'+status(b)+'</span></div></div><div class="buttons"><button onclick="call(\''+b.id+'\')">'+ico('phone',15)+' Звонок</button><button onclick="openChat(\''+b.id+'\')">'+ico('chats',15)+' Чат</button>'+(b.status==='confirmed'?'<button onclick="complete(\''+b.id+'\')">'+ico('check',15)+' Завершить</button>':'')+'</div></div>'}function home(){const upcoming=ordered(bookings.filter(b=>b.masterId===master.id&&b.status==='confirmed'&&b.date>=dateToday())).slice(0,3);return brand()+'<h1 class="title">Кабинет мастера</h1><div class="profile"><div class="avatar">О</div><div><strong>'+master.name+'</strong><div class="muted">'+master.address+'</div><div class="rating">'+ico('star',16)+' 5.0</div></div></div><div class="actions"><span class="status">На проверке</span><button class="outline" onclick="viewClient()">Как видит клиент</button></div><div class="metrics"><button class="metric" onclick="filter=\'today\';route(\'bookings\')">'+ico('bookings',23)+'<small>Сегодня</small><strong>'+todayCount()+'</strong></button><button class="metric" onclick="route(\'chats\')">'+ico('chats',23)+'<small>Чаты</small><strong>'+chatCount()+'</strong></button><button class="metric balance" onclick="route(\'profile\')">'+ico('profile',23)+'<small>Баланс</small><strong>'+balance+' TJS</strong></button></div><div class="section"><h2>Ближайшие записи</h2><button class="link" onclick="route(\'bookings\')">Все</button></div>'+(upcoming.length?upcoming.map(bookingCard).join(''):'<div class="empty">Ближайших записей пока нет</div>')+'<button class="primary" onclick="newBooking()">+ Новая запись</button>'}function masterBookings(){const data=ordered(bookings.filter(b=>b.masterId===master.id&& (filter==='today'?b.date===dateToday()&&b.status==='confirmed':filter==='upcoming'?b.date>dateToday()&&b.status==='confirmed':b.status!=='confirmed'||b.date<dateToday())));const counts=[todayCount(),bookings.filter(b=>b.date>dateToday()&&b.status==='confirmed').length,bookings.filter(b=>b.status!=='confirmed'||b.date<dateToday()).length];let groups={};data.forEach(b=>(groups[b.date]??=[]).push(b));return brand()+'<h1 class="title">Записи</h1><div class="seg">'+[['today','Сегодня'],['upcoming','Предстоящие'],['history','История']].map(([id,label],i)=>'<button class="'+(filter===id?'active':'')+'" onclick="filter=\''+id+'\';render()">'+label+' ('+counts[i]+')</button>').join('')+'</div>'+(data.length?Object.entries(groups).map(([date,bs])=>'<div class="day">'+esc(fmt(date))+'</div>'+bs.map(bookingCard).join('')).join(''):'<div class="empty" style="margin-top:22px">Нет записей</div>')+'<button class="primary" onclick="newBooking()">+ Новая запись</button>'}function clientCatalog(){let visible=(!query||['обидов','стрижка','борода','барбершоп','рудаки'].some(x=>x.includes(query.toLowerCase())||query.toLowerCase().includes(x)));return (preview?'<div class="banner">Режим просмотра <button onclick="backMaster()">Вернуться в кабинет мастера</button></div>':'')+brand()+'<h1 class="title">Найти мастера</h1><input class="search" id="search" placeholder="Найти мастера или услугу..." value="'+esc(query)+'" oninput="search(this.value)"><div class="chips">'+['Все','Барбершопы','Стрижки','Борода'].map(x=>'<button class="chip '+(chip===x?'active':'')+'" onclick="chip=\''+x+'\';render()">'+x+'</button>').join('')+'</div>'+(visible?'<div class="card"><div class="profile"><div class="avatar">О</div><div><strong style="font-size:21px">Обидов</strong><div class="rating">'+ico('star',15)+' 5.0</div><div class="muted">Душанбе, пр. Рудаки 100</div></div></div><div class="tags"><span class="tag">Стрижка от 20 TJS</span><span class="tag">Борода 15 TJS</span></div><button class="primary" onclick="detail=true;render()">Записаться</button></div>':'<div class="empty">Мастера не найдены</div>')}function bookingForm(){return brand()+'<button class="link" onclick="detail=false;render()">← Назад</button><h1 class="title" style="margin-top:15px">Запись к мастеру</h1><div class="card"><strong>Обидов · Душанбе</strong><form onsubmit="createBooking(event)"><p class="muted">Выберите услуги</p>'+services.map((s,i)=>'<label class="check"><input type="checkbox" class="service" value="'+i+'" onchange="totalPrice()" '+(i===0?'checked':'')+'><span style="flex:1">'+esc(s.name)+'</span><strong>'+s.price+' TJS</strong></label>').join('')+'<p style="font-weight:800">Итого: <span id="total">20 TJS</span></p><label class="field">Дата<input type="date" id="date" required min="'+dateToday()+'" value="'+dateToday()+'"></label><label class="field">Время<select id="slot">'+['09:00','10:00','11:00','12:00','13:30','15:00','16:00','17:00'].map(x=>'<option>'+x+'</option>').join('')+'</select></label><label class="field">Ваше имя<input id="clientName" required maxlength="70"></label><label class="field">Телефон<input id="clientPhone" required type="tel" maxlength="25" placeholder="+992..."></label><button class="primary">Подтвердить запись</button></form></div>'}function myBookings(){const data=ordered(bookings.filter(b=>b.clientId===clientId()));return brand()+'<h1 class="title">Мои записи</h1>'+(data.length?data.map(b=>'<div class="card"><strong>'+esc(b.masterName)+'</strong><div class="muted" style="margin-top:7px">'+esc(b.date)+' · '+esc(b.time)+'</div><p>'+esc(b.serviceName)+'</p><span class="badge '+esc(b.status)+'">'+status(b)+'</span><div class="pin">'+esc(b.pinCode)+'</div><p class="small">Покажите этот код мастеру после услуги</p><button class="primary" onclick="openChat(\''+b.id+'\')">Чат с мастером</button></div>').join(''):'<div class="empty">Записей пока нет</div>')}function chatList(){const ids=Object.keys(chats).filter(id=>bookings.some(b=>b.id===id&&b.masterId===master.id)&&chats[id].length);return brand()+'<h1 class="title">Чаты</h1>'+(ids.length?ids.map(id=>{const b=bookings.find(x=>x.id===id);return '<button class="card" style="width:100%;text-align:left;border:0" onclick="openChat(\''+id+'\')"><strong>'+esc(b.clientName)+'</strong><p class="muted">'+esc(chats[id].at(-1).text)+'</p></button>'}).join(''):'<div class="empty">Нет сообщений</div>')}function profilePage(){return brand()+'<h1 class="title">Профиль</h1>'+(role==='master'&&!preview?'<div class="card"><strong>'+master.name+'</strong><p>'+master.address+'</p><p>Баланс: <strong>'+balance+' TJS</strong></p><button class="primary" onclick="logout()">Выйти</button></div>':'<div class="card"><p>Клиент NAVO</p><button class="primary" onclick="loginMaster()">Я мастер — войти</button></div>')}function render(){if(activeChat)return;$('page').innerHTML=detail?bookingForm():role==='master'&&!preview?({home,bookings:masterBookings,chats:chatList,profile:profilePage}[tab]||home)():({catalog:clientCatalog,mybookings:myBookings,profile:profilePage}[tab]||clientCatalog)();$('nav').innerHTML=nav();$('nav').classList.remove('hidden')}function search(v){query=v;const p=$('page').scrollTop;render();$('page').scrollTop=p;const x=$('search');x?.focus();x?.setSelectionRange(v.length,v.length)}function totalPrice(){const selected=[...document.querySelectorAll('.service:checked')].map(x=>services[Number(x.value)]);$('total').textContent=selected.reduce((a,b)=>a+b.price,0)+' TJS'}function createBooking(e){e.preventDefault();const selected=[...document.querySelectorAll('.service:checked')].map(x=>services[Number(x.value)]);if(!selected.length){toast('Выберите хотя бы одну услугу');return}const date=$('date').value,time=$('slot').value;if(bookings.some(b=>b.masterId===master.id&&b.date===date&&b.time===time&&b.status==='confirmed')){toast('Это время уже занято');return}const id='b'+Date.now()+Math.random().toString(36).slice(2,6);bookings.push({id,masterId:master.id,masterName:master.name,clientId:clientId(),clientName:$('clientName').value.trim(),clientPhone:$('clientPhone').value.trim(),serviceName:selected.map(s=>s.name).join(', '),date,time,durationMinutes:selected.reduce((n,s)=>n+s.duration,0),price:selected.reduce((n,s)=>n+s.price,0),status:'confirmed',pinCode:String(Math.floor(1000+Math.random()*9000))});chats[id]=[];save();detail=false;tab='mybookings';render();toast('Запись подтверждена')}function newBooking(){const name=prompt('Имя клиента');if(!name)return;const phone=prompt('Телефон клиента')||'',date=prompt('Дата ГГГГ-ММ-ДД',dateToday()),time=prompt('Время ЧЧ:ММ','12:00');if(!/^\d{4}-\d{2}-\d{2}$/.test(date||'')||!/^([01]\d|2[0-3]):[0-5]\d$/.test(time||'')){toast('Проверьте дату и время');return}if(bookings.some(b=>b.date===date&&b.time===time&&b.status==='confirmed')){toast('Это время уже занято');return}bookings.push({id:'b'+Date.now(),masterId:master.id,masterName:master.name,clientName:name,clientPhone:phone,serviceName:'Мужская стрижка',date,time,durationMinutes:30,price:20,status:'confirmed',pinCode:String(Math.floor(1000+Math.random()*9000))});save();tab='bookings';render()}function call(id){const b=bookings.find(x=>x.id===id);if(b?.clientPhone)location.href='tel:'+b.clientPhone.replace(/[^+\d]/g,'')}let completing=null;function complete(id){const b=bookings.find(x=>x.id===id);if(!b||b.status!=='confirmed')return;completing=id;$('pinInput').value='';$('modal').classList.add('open');$('pinInput').focus()}function confirmPin(e){e.preventDefault();const b=bookings.find(x=>x.id===completing);if(!b)return;if($('pinInput').value!==b.pinCode){toast('Неверный PIN-код');return}b.status='completed';balance+=Number(b.price);save();$('modal').classList.remove('open');completing=null;render();toast('Услуга завершена. Баланс пополнен')}function openChat(id){const b=bookings.find(x=>x.id===id);if(!b)return;returnFromChat={tab,scroll:$('page').scrollTop,detail,preview};activeChat=id;const masterView=role==='master'&&!preview;$('chatTitle').textContent=masterView?b.clientName||b.clientPhone:b.masterName;$('chatContext').textContent=b.date+' · '+b.time+' · '+b.serviceName+' · '+status(b);$('chatCall').onclick=()=>call(id);$('chat').classList.add('open');$('nav').classList.add('hidden');renderMessages()}function backChat(){activeChat=null;$('chat').classList.remove('open');if(returnFromChat){tab=returnFromChat.tab;detail=returnFromChat.detail;preview=returnFromChat.preview;render();$('page').scrollTop=returnFromChat.scroll}returnFromChat=null}function renderMessages(){const own=role==='master'&&!preview?'master':'client';$('messages').innerHTML=(chats[activeChat]||[]).map(m=>'<div class="bubble '+(m.sender===own?'mine':'')+'">'+esc(m.text)+'<small>'+esc(m.time)+(m.sender===own?' ✓':'')+'</small></div>').join('');$('quick').innerHTML=own==='master'?['Я в дороге','Буду через 5 мин','Опаздываю на 10 мин','Жду вас, проходите'].map(t=>'<button onclick="sendText(\''+t+'\')">'+t+'</button>').join(''):'';$('messages').scrollTop=$('messages').scrollHeight}function sendText(t){if(!activeChat||!t.trim())return;chats[activeChat]??=[];chats[activeChat].push({id:'m'+Date.now(),sender:role==='master'&&!preview?'master':'client',text:t.trim(),time:new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})});save();$('messageInput').value='';renderMessages()}$('composer').addEventListener('submit',e=>{e.preventDefault();sendText($('messageInput').value)});window.addEventListener('storage',e=>{if(Object.values(K).includes(e.key)){bookings=read(K.bookings,[]);chats=read(K.chats,{});balance=Number(read(K.balance,450));if(!activeChat)render();else renderMessages()}});render();
